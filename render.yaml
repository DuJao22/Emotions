services:
  - type: web
    name: motion-showreel-agent
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: auto
